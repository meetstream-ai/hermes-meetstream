name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          path: plugin
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: NousResearch/hermes-agent
          ref: v0.23.1
          path: hermes-agent
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc  # v6.4.3
      - name: Install Hermes
        working-directory: hermes-agent
        run: uv sync --extra messaging
      - name: Unit tests
        working-directory: plugin
        run: PYTHONPATH=$GITHUB_WORKSPACE/hermes-agent $GITHUB_WORKSPACE/hermes-agent/.venv/bin/python -m unittest discover -s tests -v
      - name: Catalog validation
        run: hermes-agent/.venv/bin/hermes plugins validate plugin
