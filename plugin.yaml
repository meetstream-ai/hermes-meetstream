name: meetstream
label: Hermes in Meetings
kind: platform
version: 0.2.1
requires_hermes: ">=0.23.0"
author: MeetStream
description: >
  Hermes in Meetings, powered by MeetStream. Hermes joins your Zoom, Google Meet and Microsoft Teams
  calls as a visible bot, records and transcribes them, and does the follow-up work afterwards. While
  the Hermes gateway runs, people in the call can ask Hermes a question in the meeting chat and it
  answers there. Setup is one MeetStream API key; recording, calendar auto-join, webhooks and storage
  are configured in the MeetStream dashboard.
provides_tools:
  - meetstream_join
  - meetstream_status
  - meetstream_chat
  - meetstream_transcript
  - meetstream_leave
provides_hooks:
  - pre_llm_call
  - pre_tool_call
requires_env:
  - name: MEETSTREAM_API_KEY
    description: "MeetStream API key (starts with ms_)"
    prompt: "MeetStream API key"
    url: "https://app.meetstream.ai/api-key"
    password: true
    secret: true
optional_env:
  - name: MEETSTREAM_ALLOWED_USERS
    description: >-
      Display names of the people who may ask Hermes questions in the meeting chat, comma-separated,
      as they appear in the call (case-insensitive). Empty: nobody can; Hermes still records and
      takes notes. Names are chosen by participants, so do not rely on this list for security.
    prompt: "Meeting participants who may ask Hermes questions (comma-separated names, or empty)"
    password: false
config_schema:
  api_key:
    type: secret
    env: MEETSTREAM_API_KEY
    label: "MeetStream API key"
    description: "Create one at https://app.meetstream.ai/api-key"
  bot_name:
    type: str
    default: "Hermes"
    label: "Bot name"
    description: "Display name of the bot in the call. People address it by this name in the chat."
  transcription:
    type: str
    choices: [meetstream, meeting_captions, deepgram, assemblyai, none]
    default: meetstream
    label: "Transcription"
    description: "Transcription provider for calls Hermes joins. meetstream adds $0.10 per hour; deepgram and assemblyai need your own key saved in the MeetStream dashboard."
  join_message:
    type: str
    default: ""
    label: "Join message"
    description: "Chat message posted when the bot joins. {name} is replaced by the bot name. Empty: a short introduction."
